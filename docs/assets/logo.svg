<svg class="logo" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <!-- Prism Body -->
  <path d="M 35,25 L 85,50 L 35,75 Z" fill="#4F46E5" stroke="#A5B4FC" stroke-width="1"/>

  <!-- 3 Input Dependency Lines (solid colors, no sublines, no glow/transparency) -->
  <path d="M -10,35 L 35,35" stroke="#F472B6" stroke-width="1.5"/>
  <path d="M -10,50 L 35,50" stroke="#34D399" stroke-width="1.5"/>
  <path d="M -10,65 L 35,65" stroke="#FBBF24" stroke-width="1.5"/>

  <!-- Refracted Lines (inside the prism, solid colors) -->
  <path d="M 35,35 L 70,50" stroke="#F472B6" stroke-width="1.5"/>
  <path d="M 35,50 L 70,50" stroke="#34D399" stroke-width="1.5"/>
  <path d="M 35,65 L 70,50" stroke="#FBBF24" stroke-width="1.5"/>

  <!-- Convergence Point -->
  <circle cx="70" cy="50" r="1.5" fill="#67E8F9"/>

  <!-- Outgoing Unified Beam -->
  <path d="M 70,50 L 120,50" stroke="#67E8F9" stroke-width="1.5" fill="none"/>
</svg>
