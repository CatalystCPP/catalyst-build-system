# NOTE: we can't use extends here yet because 1.8.0 is still in development so it can't be used in CI

toolchain:
  extends: ./tc_catalyst.yaml
  name: "catalyst debug"
  compiler:
    c:
      flags_remove: -O3 -DNDEBUG -march=native -flto=full -ffunction-sections -fdata-sections
      flags_append: -O0 -ggdb -Wshadow -DDEBUG
    cxx:
      flags_remove: -O3 -DNDEBUG -march=native -flto=full -ffunction-sections -fdata-sections
      flags_append: -O0 -ggdb -Wshadow -DDEBUG
  linker:
    flags_remove: -flto=full -Wl,-O3 -Wl,--gc-sections -Wl,--icf=safe -Wl,-z,relro,-z,now -Wl,--build-id=sha1 -Wl,--strip-all -static
    flags_append: -flto=thin -Wl,--build-id=fast
