name: Latest Release

on:
  push:
    branches:
      - master

permissions:
  contents: write

concurrency:
  group: latest-release
  cancel-in-progress: true

jobs:
  build-and-release:
    name: Build and Release (Rolling)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y wget mold ccache lsb-release software-properties-common gnupg git curl unzip zip pkg-config g++-15

      - name: Install LLVM 21
        run: |
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 21
          sudo apt-get install -y clang-format-21 libc++-21-dev libc++abi-21-dev
          sudo ln -sf /usr/bin/clang-21 /usr/bin/clang
          sudo ln -sf /usr/bin/clang++-21 /usr/bin/clang++
          sudo ln -sf /usr/bin/clang-format-21 /usr/bin/clang-format

      - name: Set up vcpkg
        run: |
          git clone https://github.com/microsoft/vcpkg.git /opt/vcpkg
          /opt/vcpkg/bootstrap-vcpkg.sh -disableMetrics
        env:
          VCPKG_ROOT: /opt/vcpkg

      - name: Install Catalyst Orchestrated Builder (COB)
        run: |
          wget https://github.com/CatalystCPP/catalyst-orchestrated-builder/releases/download/0.5.0/cob-0.5.0.deb
          sudo apt-get install -y ./cob-0.5.0.deb
          rm cob-0.5.0.deb

      - name: Install Catalyst (Bootstrap compiler)
        run: |
          wget https://github.com/CatalystCPP/catalyst-build-system/releases/download/v1.4.3/catalyst-1.4.3.deb
          sudo apt-get install -y ./catalyst-1.4.3.deb
          rm catalyst-1.4.3.deb

      - name: Fetch dependencies
        run: |
          catalyst fetch --profiles common ccache release
        env:
          VCPKG_ROOT: /opt/vcpkg

      - name: Build Catalyst
        run: |
          catalyst build --profiles common ccache release
        env:
          VCPKG_ROOT: /opt/vcpkg

      - name: Recreate & Upload Rolling Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Delete existing release and tag named 'latest' (if it exists)
          gh release delete latest --cleanup-tag -y || true

          # Wait a moment for GitHub's backend to process the deletion
          sleep 3

          # Create a new prerelease with the 'latest' tag
          gh release create latest \
            --target ${{ github.sha }} \
            --title "Catalyst Development Build (Rolling)" \
            --notes "Automated pre-release build tracking the head of the main branch. Created on $(date -u)." \
            --prerelease

          # Upload all packed artifacts (e.g. .deb, .rpm, .zip, .tar.gz) from build/pack/ and avoid build/pack/_CPack_Packages
          find build/pack -maxdepth 1 -type f -exec gh release upload latest {} +
