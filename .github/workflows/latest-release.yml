name: Latest Release

on:
  push:
    branches:
      - master
      - 'dev/*'
    paths:
      - 'src/**'
      - 'include/**'
      - 'CATALYST.yaml'
      - 'Dockerfile'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: latest-release
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changes
    runs-on: blacksmith-2vcpu-ubuntu-2404
    outputs:
      dockerfile: ${{ steps.filter.outputs.dockerfile }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check whether the build image needs rebuilding
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            dockerfile:
              - 'Dockerfile'

  publish-docker:
    name: Build & Push Build Image
    needs: changes
    # Only rebuild the image when the Dockerfile changed (or when triggered manually).
    if: ${{ needs.changes.outputs.dockerfile == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      packages: write
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ghcr.io/catalystcpp/catalyst-build-env:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-and-release:
    name: Build and Release (Rolling)
    needs: [changes, publish-docker]
    # Run once the image step has settled: whether it rebuilt the image (success)
    # or was skipped because the Dockerfile was unchanged. Skip only if it failed.
    if: ${{ !cancelled() && needs.publish-docker.result != 'failure' }}
    runs-on: blacksmith-32vcpu-ubuntu-2404
    permissions:
      contents: write
      packages: read
    container:
      image: ghcr.io/catalystcpp/catalyst-build-env:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ccache-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.os }}-
          dir: .ccache

      - name: Fetch dependencies
        run: catalyst fetch --profiles common ccache release

      - name: Build Catalyst
        run: catalyst build --profiles common ccache release

      - name: Recreate & Upload Rolling Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          # Delete existing release and tag named 'latest' (if it exists)
          gh release delete latest --cleanup-tag -y || true

          # Wait a moment for GitHub's backend to process the deletion
          sleep 3

          # Create a new prerelease with the 'latest' tag
          gh release create latest \
            --target ${{ github.sha }} \
            --title "Catalyst Development Build (Rolling)" \
            --notes "Automated pre-release build tracking the head of the main branch. Created on $(date -u)." \
            --prerelease

          # Upload all packed artifacts (e.g. .deb, .rpm, .zip, .tar.gz) from build/pack/ and avoid build/pack/_CPack_Packages
          find build/pack -maxdepth 1 -type f -exec gh release upload latest {} +
