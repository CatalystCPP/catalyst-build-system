name: Build

on:
  push:
    branches: [ "release/*" ]
  pull_request:
    branches: [ "release/*" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install vcpkg
      run: |
        git clone https://github.com/microsoft/vcpkg.git
        ./vcpkg/bootstrap-vcpkg.sh
        echo "VCPKG_ROOT=$GITHUB_WORKSPACE"
        echo "VCPKG_ROOT=$GITHUB_WORKSPACE/vcpkg" >> $GITHUB_ENV

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y wget

    - name: Install cbe
      run: |
        wget https://github.com/CatalystCPP/catalyst-build-executor/releases/download/0.2.0/cbe-0.2.0.deb
        sudo apt-get install -y ./cbe-0.2.0.deb

    - name: Install Catalyst
      run: |
        wget https://github.com/CatalystCPP/catalyst-build-system/releases/download/1.3.0/catalyst-1.3.0.deb
        sudo apt-get install -y ./catalyst-1.3.0.deb

    - name: Fetch Catalyst Deps
      run: catalyst -V fetch -p common release

    - name: Build Catalyst packages
      run: catalyst -V build -p common release -r

    - name: Create packages
      run: catalyst -V pack -p common release -a
