# yaml-language-server: $schema=https://raw.githubusercontent.com/CatalystCPP/catalyst-build-system/refs/heads/master/catalyst.schema.json
common:
  meta:
    min_ver: 1.0.0
  manifest:
    name: catalyst
    type: BINARY
    version: 1.6.0-dev
    description: Catalyst is a Declarative C++ Build System
    provides: catalyst
    tooling:
      CC: clang
      CXX: clang++
      CCFLAGS: --std=c++23 -Wall -Wextra -Wpedantic
      CXXFLAGS: --std=c++23 -Wall -Wextra -Wpedantic
      LDFLAGS: -static
      FMT: clang-format
      doc:
        engine: doxygen
        out_dir: doxygen_docs
    dirs:
      include:
        - include
        - include/extern
      source:
        - src
      build: build
  dependencies:
    - name: reproc
      source: vcpkg
      triplet: x64-linux
      version: latest
    - name: ryml
      source: vcpkg
      triplet: x64-linux
      version: latest
    - name: c4core # static-lib dependency of ryml; vcpkg packages it separately
      source: vcpkg
      triplet: x64-linux
      version: latest
  hooks:
    pre-fetch:
      - script: "scripts/fetch_cli_11.sh"
      - codegen:
          cmd: "python3 $IN[0]"
          input: "scripts/embed_cob.py"
          output:
            - "include/catalyst/cob_embedded.hpp"
            - "src/utils/cob_embedded.cpp"
  features:
    uniform_logs: false
    log_machine_info: false
ccache:
  manifest:
    tooling:
      LDFLAGS: -fuse-ld=mold # put it here since this is the "fast build" profile
      CC_LAUNCHER: ccache
      CXX_LAUNCHER: ccache
test:
  manifest:
    name: catalyst_tests
    provides: catalyst_tests
    type: binary
    dirs:
      source:
        - tests
      build: build/test
  dependencies:
    - name: catch2
      source: vcpkg
      triplet: x64-linux
      version: latest
    - name: yaml-cpp # second parser for cross-parser checks in test_yaml_characterization.cpp
      source: vcpkg
      triplet: x64-linux
      version: latest
debug:
  manifest:
    tooling:
      CCFLAGS: -std=c23 -O0 -ggdb -Wall -Wextra -Wpedantic -Wshadow -DDEBUG
      CXXFLAGS: -std=c++23 -O0 -ggdb -Wall -Wextra -Wpedantic -Wshadow -DDEBUG
      LDFLAGS: -fuse-ld=mold -flto=thin -Wl,--as-needed -Wl,--no-undefined -Wl,--hash-style=gnu -Wl,--build-id=fast
release:
  manifest:
    tooling:
      CCFLAGS: -std=c23 -O3 -Wall -Wextra -Wpedantic -DNDEBUG -march=native -flto=full -ffunction-sections -fdata-sections
      CXXFLAGS: -std=c++23 -O3 -Wall -Wextra -Wpedantic -DNDEBUG -march=native -flto=full -ffunction-sections -fdata-sections
      LDFLAGS: -fuse-ld=mold -flto=full -Wl,-O3 -Wl,--gc-sections -Wl,--icf=safe -Wl,--as-needed -Wl,--no-undefined -Wl,-z,relro,-z,now -Wl,--hash-style=gnu -Wl,--build-id=sha1 -Wl,--strip-all -static
  hooks:
    post-build:
      - catalyst: pack -q -p common release -a
      - script: "scripts/generate_cli_docs.sh"

linux_x86_64:
  manifest:
    tooling:
      CC: x86_64-linux-gnu-gcc
      CXX: x86_64-linux-gnu-g++
linux_aarch64:
  manifest:
    tooling:
      CC: aarch64-linux-gnu-gcc
      CXX: aarch64-linux-gnu-g++
windows_x86_64:
  manifest:
    tooling:
      CC: x86_64-w64-mingw32-gcc
      CXX: x86_64-w64-mingw32-g++
macos_x86_64:
  manifest:
    tooling:
      CC: x86_64-apple-darwin-clang
      CXX: x86_64-apple-darwin-clang++
macos_arm64:
  manifest:
    tooling:
      CC: aarch64-apple-darwin-clang
      CXX: aarch64-apple-darwin-clang++
