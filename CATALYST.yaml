# yaml-language-server: $schema=https://raw.githubusercontent.com/CatalystCPP/catalyst-build-system/refs/heads/master/catalyst.schema.json
common:
  meta:
    min_ver: 1.0.0
  manifest:
    name: catalyst
    type: BINARY
    version: 1.8.0
    description: Catalyst is a Declarative C++ Build System
    provides: catalyst
    toolchain: tc_catalyst.yaml
    tooling:
      FMT: clang-format
      doc:
        engine: doxygen
        out_dir: doxygen_docs
    dirs:
      include:
        - include
        - include/extern
      source:
        - src
      build: build
  dependencies:
    - name: reproc
      source: vcpkg
      triplet: x64-linux
      version: latest
    - name: ryml
      source: vcpkg
      triplet: x64-linux
      version: latest
  hooks:
    pre-fetch:
      - script: "scripts/fetch_cli_11.sh"
      - codegen:
          cmd: "python3 $IN[0]"
          input: "scripts/embed_cob.py"
          output:
            - "include/catalyst/cob_embedded.hpp"
            - "src/utils/cob_embedded.cpp"
  features:
    uniform_logs: false
    log_machine_info: false
ccache:
  manifest:
    tooling:
      CC_LAUNCHER: ccache
      CXX_LAUNCHER: ccache
test:
  manifest:
    name: catalyst_tests
    provides: catalyst_tests
    type: binary
    dirs:
      source:
        - tests
      build: build/test
  dependencies:
    - name: catch2
      source: vcpkg
      triplet: x64-linux
      version: latest
    - name: yaml-cpp # second parser for cross-parser checks in test_yaml_characterization.cpp
      source: vcpkg
      triplet: x64-linux
      version: latest
debug:
  manifest:
    toolchain: tc_catalyst_debug.yaml
release:
  hooks:
    post-build:
      - catalyst: pack -q -p common release -a
      - script: "scripts/generate_cli_docs.sh"
