# yaml-language-server: $schema=https://raw.githubusercontent.com/CatalystCPP/catalyst-build-system/refs/heads/master/catalyst.schema.json
common:
  meta:
    min_ver: 1.0.0
  manifest:
    name: catalyst
    type: BINARY
    version: 1.2.0
    description: Catalyst is a Declarative C++ Package Manager
    provides: catalyst
    tooling:
      CC: clang
      CXX: clang++
      CCFLAGS: --std=c++23 -Wall -Wextra -Wpedantic
      CXXFLAGS: --std=c++23 -Wall -Wextra -Wpedantic
      FMT: clang-format
      doc:
        engine: doxygen
        out_dir: doxygen_docs
    dirs:
      include:
        - include
      source:
        - src
      build: build
  dependencies:
    - name: yaml-cpp
      source: vcpkg
      triplet: x64-linux
      version: latest
      using: []
    - name: cli11
      source: system
      linkage: interface
    - name: reproc
      source: vcpkg
      triplet: x64-linux
      version: latest
    - name: nlohmann-json
      source: vcpkg
      triplet: x64-linux
      version: latest
      linkage: interface
ccache:
  manifest:
    tooling:
      CC_LAUNCHER: ccache
      CXX_LAUNCHER: ccache
test:
  manifest:
    name: catalyst_tests
    provides: catalyst_tests
    type: binary
    dirs:
      source:
        - tests
      build: build/test
  dependencies:
    - name: catch2
      source: vcpkg
      triplet: x64-linux
      version: latest
debug:
  manifest:
    tooling:
      CCFLAGS: -g --std=c++23 -Wall -Wextra -Wpedantic
      CXXFLAGS: -g --std=c++23 -Wall -Wextra -Wpedantic
release:
  manifest:
    tooling:
      CCFLAGS: -O3 -DNDEBUG --std=c++23 -Wall -Wextra -Wpedantic
      CXXFLAGS: -O3 -DNDEBUG --std=c++23 -Wall -Wextra -Wpedantic
linux_x86_64:
  manifest:
    tooling:
      CC: x86_64-linux-gnu-gcc
      CXX: x86_64-linux-gnu-g++
linux_aarch64:
  manifest:
    tooling:
      CC: aarch64-linux-gnu-gcc
      CXX: aarch64-linux-gnu-g++
windows_x86_64:
  manifest:
    tooling:
      CC: x86_64-w64-mingw32-gcc
      CXX: x86_64-w64-mingw32-g++
      LDFLAGS: -static
macos_x86_64:
  manifest:
    tooling:
      CC: x86_64-apple-darwin-clang
      CXX: x86_64-apple-darwin-clang++
macos_arm64:
  manifest:
    tooling:
      CC: aarch64-apple-darwin-clang
      CXX: aarch64-apple-darwin-clang++
