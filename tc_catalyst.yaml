toolchain:
  name: "catalyst default"
  extensions:
    object: ".o"
    executable: ""
    static_lib: ".a"
    shared_lib: ".so"
    static_lib_prefix: "lib"
    shared_lib_prefix: "lib"
  flags:
    include_dir: "-I{path}"
    lib_dir: "-L{path}"
    lib: "-l{name}"
    rpath: "-Wl,-rpath,{path}"
    define: "-D{name}={value}"
    define_empty: "-D{name}"
  compiler:
    c:
      executable: "clang"
      flags: -std=c23 -O3 -Wall -Wextra -Wpedantic -DNDEBUG -march=x86-64-v2 -flto=full -ffunction-sections -fdata-sections
      command: "{cc} {cflags} -MMD -MF {object}.d -c {source} -o {object} {includes} {defines}"
    cxx:
      executable: "clang++"
      flags: -std=c++23 -O3 -Wall -Wextra -Wpedantic -DNDEBUG -march=x86-64-v2 -flto=full -ffunction-sections -fdata-sections
      command: "{cxx} {cxxflags} -MMD -MF {object}.d -c {source} -o {object} {includes} {defines}"
  linker:
    executable: "clang++"
    executable_command: "{linker} {objects} -o {output} {ldflags} {lib_dirs} {rpaths} {libs}"
    shared_lib_command: "{linker} -shared {objects} -o {output} {ldflags} {lib_dirs} {rpaths} {libs}"
    flags: -fuse-ld=mold -flto=full -Wl,-O3 -Wl,--gc-sections -Wl,--icf=safe -Wl,--as-needed -Wl,--no-undefined -Wl,-z,relro,-z,now -Wl,--hash-style=gnu -Wl,--build-id=sha1 -Wl,--strip-all -static
  archiver:
    executable: "ar"
    command: "{archiver} rcs {output} {objects}"
